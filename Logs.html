<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CupSion FMIS · Audit log</title>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head><body data-role="owner">
<header><div class="logo">CS</div><h1>CupSion</h1>
<span class="who">Maria Santos · Owner</span><a class="out" href="/logout">Log out</a></header>
<nav><a href="Index.html">Take order</a><a href="Ledger.html">Daily ledger</a><a href="Inventory.html">Inventory</a><a href="Sales.html">Sales chart</a><a href="Forecast.html">Forecast</a><a href="Prices.html">Menu & prices</a><a href="Report.html">Daily report</a><a href="Logs.html" class="on" aria-current="page">Audit log</a><a href="Settings.html">Settings</a></nav>
<main>
<div class="card"><h2>Audit log</h2>
<p class="sub">Newest first. Every recorded action across the app.</p>
<div class="scroll"><table>
<thead><tr><th>When</th><th>User</th><th>Payment method</th><th>Customer total</th><th>Action</th></tr></thead>
<tbody id="logs-body"></tbody>
</table></div></div>
</main>
<script>
const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, character => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
})[character]);
(async () => {
  const db = await (await fetch('/api/db?t=' + Date.now())).json();
  const logs = db.logs || [];
  const tbody = document.getElementById('logs-body');
  tbody.innerHTML = logs.length ? '' : '<tr><td colspan="5" class="sub">No activity yet.</td></tr>';
  for (const l of logs) {
    const saleMatch = l.action.match(/^(?:Recorded|Voided) sale\b.*?₱\s*([\d,]+),\s*(Cash|GCash)(?=\)|;)/i);
    const paymentMethod = saleMatch ? saleMatch[2] : '—';
    const customerTotal = saleMatch ? `₱ ${saleMatch[1]}` : '—';
    const action = saleMatch
      ? l.action.replace(/(?:\s*–\s*)?₱\s*[\d,]+,\s*(?:Cash|GCash)/i, '').replace(/\(\s*\);/, ';').replace(/\s+;/, ';')
      : l.action;
    tbody.insertAdjacentHTML('beforeend',
      `<tr><td>${escapeHtml(l.when)}</td><td>${escapeHtml(l.user)}</td><td>${paymentMethod}</td><td>${escapeHtml(customerTotal)}</td><td>${escapeHtml(action)}</td></tr>`);
  }
})();
</script>
<script src="user.js"></script>
</body></html>
