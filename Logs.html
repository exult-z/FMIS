<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CupSion FMIS · Audit log</title>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head><body data-role="owner">
<header><div class="logo">CS</div><h1>CupSion</h1>
<span class="who">Maria Santos · Owner</span><a class="out" href="/logout">Log out</a></header>
<nav><a href="Index.html">Take order</a><a href="Ledger.html">Daily ledger</a><a href="Inventory.html">Inventory</a><a href="Sales.html">Sales chart</a><a href="Prices.html">Menu & prices</a><a href="Report.html">Daily report</a><a href="Logs.html" class="on" aria-current="page">Audit log</a></nav>
<main>
<div class="card"><h2>Audit log</h2>
<p class="sub">Newest first. Every recorded action across the app.</p>
<div class="scroll"><table>
<thead><tr><th>When</th><th>User</th><th>Action</th></tr></thead>
<tbody id="logs-body"></tbody>
</table></div></div>
</main>
<script>
(async () => {
  const db = await (await fetch('/api/db?t=' + Date.now())).json();
  const logs = db.logs || [];
  const tbody = document.getElementById('logs-body');
  tbody.innerHTML = logs.length ? '' : '<tr><td colspan="3" class="sub">No activity yet.</td></tr>';
  for (const l of logs) {
    tbody.insertAdjacentHTML('beforeend',
      `<tr><td>${l.when}</td><td>${l.user}</td><td>${l.action}</td></tr>`);
  }
})();
</script>
</body></html>
