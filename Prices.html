<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CupSion FMIS · Menu & prices</title>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head><body data-role="owner">
<header><div class="logo">CS</div><h1>CupSion</h1>
<span class="who">Maria Santos · Owner</span><a class="out" href="/logout">Log out</a></header>
<nav><a href="Index.html">Take order</a><a href="Ledger.html">Daily ledger</a><a href="Inventory.html">Inventory</a><a href="Sales.html">Sales chart</a><a href="Prices.html" class="on" aria-current="page">Menu & prices</a><a href="Report.html">Daily report</a><a href="Logs.html">Audit log</a><a href="Settings.html">Settings</a></nav>
<main>

<div class="card"><h2>Current menu</h2>
<p class="sub">Edit a name or price and save — changes apply to Take order immediately.</p>
<table>
<thead><tr><th>Item</th><th>Price (₱)</th><th>Save</th><th></th></tr></thead>
<tbody id="prices-body"></tbody>
</table></div>

<div class="card"><h2>Add new item</h2>
<form class="form" method="post" action="/menu/add">
<label class="field">Item name<input type="text" name="name" placeholder="e.g. Strawberry Latte" required></label>
<label class="field">Price (₱)<input type="number" name="price" min="1" placeholder="80" required></label>
<button type="submit" class="btn pri">Add item</button>
</form></div>

</main>
<script>
(async () => {
  const db = await (await fetch('/api/db?t=' + Date.now())).json();
  const menu = db.menu || {};
  const tbody = document.getElementById('prices-body');
  const entries = Object.entries(menu);
  tbody.innerHTML = entries.length ? '' : '<tr><td colspan="4" class="sub">No menu items yet.</td></tr>';

  for (const [id, it] of entries) {
    tbody.insertAdjacentHTML('beforeend', `
      <tr>
        <td>
          <form method="post" action="/menu/update" id="f-${id}">
            <input type="hidden" name="id" value="${id}">
            <input type="text" name="name" value="${it.name}" required>
          </form>
        </td>
        <td>
            <input type="number" name="price" value="${it.price}" min="1" required form="f-${id}">
        </td>
        <td><button type="submit" class="btn sm pri" form="f-${id}">Save</button></td>
        <td>
          <form method="post" action="/menu/delete" onsubmit="return confirm('Remove ${it.name} from menu?')">
            <input type="hidden" name="id" value="${id}">
            <button type="submit" class="btn sm">Remove</button>
          </form>
        </td>
      </tr>`);
  }
})();
</script>
<script src="user.js"></script>
</body></html>
