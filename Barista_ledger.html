<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CupSion FMIS · My ledger</title>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head><body data-role="barista">
<header><div class="logo">CS</div><h1>CupSion</h1>
<span class="who">Barista 1 · Barista</span><a class="out" href="/logout">Log out</a></header>
<nav><a href="Barista_index.html">Take order</a><a href="Barista_ledger.html" class="on" aria-current="page">My ledger</a><a href="Barista_inventory.html">Inventory</a><a href="Barista_sales.html">Sales chart</a></nav>
<main>
<div class="card"><h2>Sales today</h2>
<p class="sub" id="b-ledger-sub">Loading…</p>
<div class="scroll"><table>
<thead><tr><th>Time</th><th>Order</th><th>Method</th><th>Amount</th></tr></thead>
<tbody id="b-ledger-body"></tbody>
</table></div>
<div class="grid3">
  <div class="stat"><span>Cash</span><span class="num" id="b-cash">₱ 0</span><div class="bar"><b id="b-cash-bar" style="width:0%"></b></div></div>
  <div class="stat"><span>GCash</span><span class="num" id="b-gcash">₱ 0</span><div class="bar gc"><b id="b-gcash-bar" style="width:0%"></b></div></div>
  <div class="stat dk"><span>Total income</span><span class="num" id="b-total">₱ 0</span></div>
</div>
</div>
</main>
<script>
async function loadLedger() {
  const db = await (await fetch('/api/db')).json();
  const tbody = document.getElementById('b-ledger-body');
  tbody.innerHTML = '';
  let cash = 0, gcash = 0;
  db.sales.forEach(s => {
    const isCash = s.method === 'Cash';
    if (isCash) cash += s.amount; else gcash += s.amount;
    tbody.insertAdjacentHTML('beforeend', `
      <tr>
        <td>${s.time}</td>
        <td>${s.order}</td>
        <td><span class="pill ${isCash ? 'cash' : 'gcash'}">${s.method}</span></td>
        <td><b>₱ ${s.amount}</b></td>
      </tr>`);
  });
  if (!db.sales.length) tbody.innerHTML = '<tr><td colspan="4" class="sub">No sales yet today.</td></tr>';
  const total = cash + gcash;
  document.getElementById('b-cash').textContent = `₱ ${cash}`;
  document.getElementById('b-gcash').textContent = `₱ ${gcash}`;
  document.getElementById('b-total').textContent = `₱ ${total}`;
  document.getElementById('b-cash-bar').style.width = total ? (cash / total * 100) + '%' : '0%';
  document.getElementById('b-gcash-bar').style.width = total ? (gcash / total * 100) + '%' : '0%';
  document.getElementById('b-ledger-sub').textContent =
    new Date().toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })
    + ` · ${db.sales.length} sale${db.sales.length === 1 ? '' : 's'}`;
}
loadLedger();
</script>
</body></html>
