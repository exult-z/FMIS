<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CupSion FMIS · Daily ledger</title>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head><body data-role="owner">
<header><div class="logo">CS</div><h1>CupSion</h1>
<span class="who">Maria Santos · Owner</span><a class="out" href="/logout">Log out</a></header>
<nav><a href="Dashboard.html">Dashboard</a><a href="Index.html">Take order</a><a href="Ledger.html" class="on" aria-current="page">Daily ledger</a><a href="Inventory.html">Inventory</a><a href="Sales.html">Sales chart</a><a href="Forecast.html">Forecast</a><a href="Prices.html">Menu &amp; prices</a><a href="Report.html">Daily report</a><a href="Logs.html">Audit log</a><a href="Settings.html">Settings</a></nav>
<main>
<div class="card"><h2>Recorded sales today</h2>
<p class="sub" id="ledger-sub">Loading…</p>
<div class="scroll"><table>
<thead><tr><th>Time</th><th>Order</th><th>Method</th><th>Cash details</th><th>Amount</th><th>Recorded by</th><th></th></tr></thead>
<tbody id="sales-table-body"></tbody>
</table></div>
<div class="grid3">
  <div class="stat"><span>Cash</span><span class="num" id="l-cash">₱ 0</span><div class="bar"><b id="l-cash-bar" style="width:0%"></b></div></div>
  <div class="stat"><span>GCash</span><span class="num" id="l-gcash">₱ 0</span><div class="bar gc"><b id="l-gcash-bar" style="width:0%"></b></div></div>
  <div class="stat dk"><span>Total income</span><span class="num" id="l-total">₱ 0</span></div>
</div></div>
</main>
<script>
const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, character => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
})[character]);
(async () => {
  const db = await (await fetch('/api/db?t=' + Date.now())).json();
  const sales = db.sales || [];
  const tbody = document.getElementById('sales-table-body');
  tbody.innerHTML = sales.length ? '' : '<tr><td colspan="7" class="sub">No sales yet today.</td></tr>';
  
  let cash = 0, gcash = 0;
  for (const s of sales) {
    // FIXED: Case-insensitive check for the payment method
    const methodStr = String(s.method || '').trim().toLowerCase();
    
    if (methodStr === 'cash') {
      cash += s.amount;
    } else if (methodStr === 'gcash') {
      gcash += s.amount;
    }

    // UI styling check
    const isCashUI = methodStr === 'cash';
    
    tbody.insertAdjacentHTML('beforeend', `
      <tr><td>${s.time}</td><td>${s.order}</td>
      <td><span class="pill ${isCashUI ? 'cash' : 'gcash'}">${s.method}</span></td>
      <td>${isCashUI
        ? s.cashReceived == null ? 'Cash details unavailable' : `Received ₱ ${s.cashReceived} · Change ₱ ${s.changeGiven}`
        : '—'}</td>
      <td><b>₱ ${s.amount}</b></td>
      <td>${escapeHtml(s.recordedBy)}</td>
      <td><form method="post" action="/void-sale">
      <input type="hidden" name="saleId" value="${s.id}">
      <button type="submit" class="btn sm">Void</button></form></td></tr>`);
  }
  
  const total = cash + gcash;
  document.getElementById('l-cash').textContent = '₱ ' + cash;
  document.getElementById('l-gcash').textContent = '₱ ' + gcash;
  document.getElementById('l-total').textContent = '₱ ' + total;
  
  document.getElementById('l-cash-bar').style.width = total ? (cash / total * 100) + '%' : '0%';
  document.getElementById('l-gcash-bar').style.width = total ? (gcash / total * 100) + '%' : '0%';
  
  document.getElementById('ledger-sub').textContent =
    new Date().toLocaleDateString(undefined, { weekday:'long', year:'numeric', month:'long', day:'numeric' })
    + ` · ${sales.length} sale${sales.length === 1 ? '' : 's'}`;
})();
</script>
<script src="user.js"></script>
</body></html>
