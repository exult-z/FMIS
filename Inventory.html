<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CupSion FMIS · Inventory</title>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head><body data-role="owner">
<header><div class="logo">CS</div><h1>CupSion</h1>
<span class="who">Maria Santos · Owner</span><a class="out" href="/logout">Log out</a></header>
<nav><a href="Index.html">Take order</a><a href="Ledger.html">Daily ledger</a><a href="Inventory.html" class="on" aria-current="page">Inventory</a><a href="Sales.html">Sales chart</a><a href="Prices.html">Menu &amp; prices</a><a href="Report.html">Daily report</a><a href="Logs.html">Audit log</a></nav>
<main>
<div class="card"><h2>Stock &amp; supplies</h2>
<table>
<thead><tr><th>Item</th><th>Stock</th><th>Status</th><th></th></tr></thead>
<tbody id="inventory-table-body"></tbody>
</table></div>

<div class="card"><h2>Add custom stock</h2>
<form class="form" method="post" action="/inventory/add">
<label class="field">Item name<input type="text" name="name" placeholder="e.g. Oat milk" required></label>
<label class="field">Unit<input type="text" name="unit" value="units"></label>
<label class="field">Starting stock<input type="number" name="stock" min="0" value="0"></label>
<button type="submit" class="btn pri">Add item</button>
</form></div>

<div class="card"><h2>Restock inventory</h2>
<form class="form" method="post" action="/inventory/restock">
<label class="field">Item<select name="id" id="restock-select"></select></label>
<label class="field">Quantity to add<input type="number" name="qty" value="10" min="1" required></label>
<button type="submit" class="btn pri">Confirm restock</button>
</form></div>

<div class="card"><h2>Log wastage</h2>
<form class="form" method="post" action="/inventory/waste">
<label class="field">Item<select name="id" id="waste-select"></select></label>
<label class="field">Quantity<input type="number" name="qty" value="1" min="1"></label>
<label class="field">Reason<select name="reason"><option>Spoiled</option><option>Spilled</option><option>Expired</option><option>Other</option></select></label>
<button type="submit" class="btn pri">Log wastage</button>
</form></div>
</main>
<script>
(async () => {
  const db = await (await fetch('/api/db?t=' + Date.now())).json();
  const inv = db.inventory || [];
  const tbody = document.getElementById('inventory-table-body');
  tbody.innerHTML = inv.length ? '' : '<tr><td colspan="4" class="sub">No inventory records.</td></tr>';
  for (const it of inv) {
    const isLow = it.stock < 15;
    tbody.insertAdjacentHTML('beforeend', `
      <tr><td><b>${it.name}</b></td><td>${it.stock} ${it.unit||''}</td>
      <td><span class="pill ${isLow ? 'low' : 'ok'}">${isLow ? 'Low' : 'OK'}</span></td>
      <td><form method="post" action="/inventory/delete" onsubmit="return confirm('Remove ${it.name}?')">
      <input type="hidden" name="id" value="${it.id}"><button class="btn sm" type="submit">Remove</button></form></td></tr>`);
  }
  const opts = inv.map(it => `<option value="${it.id}">${it.name}</option>`).join('');
  document.getElementById('restock-select').innerHTML = opts;
  document.getElementById('waste-select').innerHTML = opts;
})();
</script>
</body></html>
