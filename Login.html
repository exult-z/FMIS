<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CupSion FMIS · Login</title>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head><body>
<header><div class="logo">CS</div><h1>CupSion</h1></header>
<main>
<div class="card" style="max-width:420px;margin:40px auto">
  <h2>Sign in</h2>
  <form class="form" method="post" action="/login">
    <label class="field">Role
      <select name="role" id="role-select">
        <option value="owner">Owner</option>
        <option value="barista">Barista</option>
      </select>
    </label>
    <label class="field" id="username-field" hidden>Barista username
      <input type="text" name="username" autocomplete="username" placeholder="Enter your username">
    </label>
    <label class="field">Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <p class="sub" id="login-error" role="alert"></p>
    <button type="submit" class="btn pri">Log in</button>
  </form>
</div>
</main>
<script>
document.getElementById('role-select').addEventListener('change', e => {
  const isBarista = e.target.value === 'barista';
  document.getElementById('username-field').hidden = !isBarista;
  document.querySelector('[name="username"]').required = isBarista;
});
const error = new URLSearchParams(location.search).get('error');
if (error === 'wrong_password') document.getElementById('login-error').textContent = 'Incorrect username or password.';
document.getElementById('role-select').dispatchEvent(new Event('change'));
</script>
</body></html>
