<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CupSion FMIS · Login</title>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head><body>
<header><div class="logo">CS</div><h1>CupSion</h1></header>
<main>
<div class="card" style="max-width:420px;margin:40px auto">
  <h2>Sign in</h2>
  <form class="form" method="post" action="/login">
    <label class="field">Role
      <select name="role" id="role-select">
        <option value="owner">Owner</option>
        <option value="barista">Barista</option>
      </select>
    </label>
    <label class="field" id="pin-field">Owner PIN
      <input type="password" name="pin" placeholder="••••">
    </label>
    <label class="field" id="barista-field" style="display:none">Barista name
      <input type="text" name="barista" placeholder="e.g. Juan">
    </label>
    <button type="submit" class="btn pri">Log in</button>
  </form>
  <p class="sub" style="margin-top:12px">Default owner PIN: <b>1234</b></p>
</div>
</main>
<script>
document.getElementById('role-select').addEventListener('change', e => {
  const owner = e.target.value === 'owner';
  document.getElementById('pin-field').style.display = owner ? '' : 'none';
  document.getElementById('barista-field').style.display = owner ? 'none' : '';
});
</script>
</body></html>
