<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CupSion FMIS · Barista · Take order</title>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head><body data-role="barista">
<header><div class="logo">CS</div><h1>CupSion</h1>
<span class="who">Barista · on shift</span><a class="out" href="/logout">Log out</a></header>
<nav><a href="Barista_index.html" class="on" aria-current="page">Take order</a><a href="Barista_ledger.html">My ledger</a><a href="Barista_inventory.html">Inventory</a><a href="Barista_sales.html">Sales chart</a><a href="Settings.html">Settings</a></nav>
<main>
<form method="post" action="/record-sale" id="pos-form">
<p class="alert" id="pos-message" role="alert" hidden></p>
<div class="card"><h2>New order</h2><p class="sub">Tap drinks to add to cart.</p>
<div class="menu" id="pos-menu"></div></div>

<div class="card"><h2>Current order</h2>
<div class="cart-columns"><span>Quantity</span><span>Product</span><span>Total</span></div>
<div id="cart-items"></div>
<div class="total"><b>Total</b><span class="num" id="cart-total">₱ 0</span></div>
<input type="hidden" name="orderSummary" id="hidden-items-input">
<input type="hidden" name="orderData" id="hidden-order-data">
<input type="hidden" name="amount" id="hidden-amount-input" value="0">
<input type="hidden" name="method" id="hidden-method-input" value="Cash">
<div class="acts">
<button type="button" class="btn cash on" id="btn-cash" onclick="setPayment('Cash')">Cash</button>
<button type="button" class="btn gcash" id="btn-gcash" onclick="setPayment('GCash')">GCash</button>
</div>
<div class="cash-details" id="cash-details">
  <label class="field" for="cash-received">Cash received
    <input id="cash-received" name="cashReceived" type="number" min="0" step="1" inputmode="numeric" required>
  </label>
  <div class="cash-change">Change due <b id="cash-change">₱ 0</b></div>
</div>
<div class="acts"><button type="submit" class="btn pri">Record sale</button></div>
</div>
</form>
</main>
<script>
let cart = {};
const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, character => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
})[character]);
function setPayment(method) {
  document.getElementById('hidden-method-input').value = method;
  document.getElementById('btn-cash').classList.toggle('on', method === 'Cash');
  document.getElementById('btn-gcash').classList.toggle('on', method === 'GCash');
  const cashDetails = document.getElementById('cash-details');
  const cashReceived = document.getElementById('cash-received');
  const isCash = method === 'Cash';
  cashDetails.hidden = !isCash;
  cashReceived.required = isCash;
  cashReceived.disabled = !isCash;
  updateCashChange();
}
function updateCashChange() {
  const total = Number(document.getElementById('hidden-amount-input').value);
  const received = Number(document.getElementById('cash-received').value);
  const change = received - total;
  document.getElementById('cash-change').textContent =
    Number.isFinite(change) && change < 0
      ? 'Short by ₱ ' + Math.abs(change)
      : '₱ ' + (Number.isFinite(change) ? change : 0);
}
function renderCart() {
  const container = document.getElementById('cart-items');
  container.innerHTML = '';
  let total = 0; const summary = [];
  for (const id in cart) {
    const item = cart[id]; const sub = item.price * item.qty;
    total += sub; summary.push(item.name + ' × ' + item.qty);
    container.insertAdjacentHTML('beforeend',
      `<div class="row cart-row"><span class="qty-controls"><span class="qty">${item.qty}</span><button type="button" class="x" data-id="${escapeHtml(id)}" aria-label="Remove one ${escapeHtml(item.name)}">−</button></span><span class="g">${escapeHtml(item.name)}</span><b class="line-total">₱ ${sub}</b></div>`);
  }
  if (!Object.keys(cart).length) container.innerHTML = '<p class="sub">No items in current order. Tap a drink above.</p>';
  container.querySelectorAll('.x').forEach(button => button.addEventListener('click', () => removeItem(button.dataset.id)));
  document.getElementById('cart-total').textContent = '₱ ' + total;
  document.getElementById('hidden-items-input').value = summary.join(', ');
  document.getElementById('hidden-amount-input').value = total;
  document.getElementById('cash-received').min = total;
  document.getElementById('hidden-order-data').value = JSON.stringify(
    Object.entries(cart).map(([id, item]) => ({ id, qty: item.qty }))
  );
  updateCashChange();
}
function removeItem(id) {
  if (!cart[id]) return;
  if (--cart[id].qty <= 0) delete cart[id];
  renderCart();
}
(async () => {
  const db = await (await fetch('/api/db?t=' + Date.now())).json();
  const menu = db.menu || {};
  const wrap = document.getElementById('pos-menu');
  wrap.innerHTML = Object.entries(menu).map(([id, it]) =>
    `<button type="button" class="chip" data-id="${escapeHtml(id)}" data-name="${escapeHtml(it.name)}" data-price="${it.price}">
       <span>${escapeHtml(it.name)}<small>₱ ${it.price}</small></span></button>`).join('');
  wrap.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.id, name = b.dataset.name, price = +b.dataset.price;
    if (!cart[id]) cart[id] = { name, price, qty: 0 };
    cart[id].qty++; renderCart();
  }));
  renderCart();
})();
document.getElementById('pos-form').addEventListener('submit', event => {
  if (!document.getElementById('hidden-order-data').value) event.preventDefault();
});
document.getElementById('cash-received').addEventListener('input', updateCashChange);
const posParams = new URLSearchParams(location.search);
if (posParams.get('error')) {
  const message = document.getElementById('pos-message');
  const error = posParams.get('error');
  message.textContent = error === 'stock'
    ? `${posParams.get('item') || 'An ingredient'} has insufficient stock. No sale was recorded.`
    : error === 'cash' ? 'Cash received must cover the order total. No sale was recorded.'
    : error === 'server' ? 'The sale could not be saved. Please try again.'
      : 'Add at least one menu item before recording a sale.';
  message.hidden = false;
}
</script>
<script src="user.js"></script>
</body></html>
