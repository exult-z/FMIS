<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CupSion FMIS · Barista · Take order</title>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head><body data-role="barista">
<header><div class="logo">CS</div><h1>CupSion</h1>
<span class="who">Barista · on shift</span><a class="out" href="/logout">Log out</a></header>
<nav><a href="Barista_index.html" class="on" aria-current="page">Take order</a><a href="Barista_ledger.html">My ledger</a><a href="Barista_inventory.html">Inventory</a><a href="Barista_sales.html">Sales chart</a><a href="Settings.html">Settings</a></nav>
<form method="post" action="/record-sale" id="pos-form">
<div class="card"><h2>New order</h2><p class="sub">Tap drinks to add to cart.</p>
<div class="menu" id="pos-menu"></div></div>

<div class="card"><h2>Current order</h2>
<div id="cart-items"></div>
<div class="total"><b>Total</b><span class="num" id="cart-total">₱ 0</span></div>
<input type="hidden" name="orderSummary" id="hidden-items-input">
<input type="hidden" name="amount" id="hidden-amount-input" value="0">
<input type="hidden" name="method" id="hidden-method-input" value="Cash">
<div class="acts">
<button type="button" class="btn cash on" id="btn-cash" onclick="setPayment('Cash')">Cash</button>
<button type="button" class="btn gcash" id="btn-gcash" onclick="setPayment('GCash')">GCash</button>
<button type="submit" class="btn pri">Record sale</button>
</div></div>
</form>
</main>
<script>
let cart = {};
function setPayment(method) {
  document.getElementById('hidden-method-input').value = method;
  document.getElementById('btn-cash').classList.toggle('on', method === 'Cash');
  document.getElementById('btn-gcash').classList.toggle('on', method === 'GCash');
}
function renderCart() {
  const container = document.getElementById('cart-items');
  container.innerHTML = '';
  let total = 0; const summary = [];
  for (const name in cart) {
    const item = cart[name]; const sub = item.price * item.qty;
    total += sub; summary.push(name + ' × ' + item.qty);
    container.insertAdjacentHTML('beforeend',
      `<div class="row"><span class="qty">× ${item.qty}</span><span class="g">${name}</span><b>₱ ${sub}</b><button type="button" class="x" onclick="removeItem('${name.replace(/'/g,"\\'")}')">−</button></div>`);
  }
  if (!Object.keys(cart).length) container.innerHTML = '<p class="sub">No items in current order. Tap a drink above.</p>';
  document.getElementById('cart-total').textContent = '₱ ' + total;
  document.getElementById('hidden-items-input').value = summary.join(', ');
  document.getElementById('hidden-amount-input').value = total;
}
function removeItem(name) {
  if (!cart[name]) return;
  if (--cart[name].qty <= 0) delete cart[name];
  renderCart();
}
(async () => {
  const db = await (await fetch('/api/db?t=' + Date.now())).json();
  const menu = db.menu || {};
  const wrap = document.getElementById('pos-menu');
  wrap.innerHTML = Object.entries(menu).map(([id, it]) =>
    `<button type="button" class="chip" data-name="${it.name}" data-price="${it.price}">
       <span>${it.name}<small>₱ ${it.price}</small></span></button>`).join('');
  wrap.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
    const name = b.dataset.name, price = +b.dataset.price;
    if (!cart[name]) cart[name] = { price, qty: 0 };
    cart[name].qty++; renderCart();
  }));
  renderCart();
})();
document.getElementById('pos-form').addEventListener('submit', event => {
  const summary = document.getElementById('hidden-items-input').value;
  const amount = document.getElementById('hidden-amount-input').value;
  if (!summary || !confirm(`Confirm recording this sale?\n${summary}\nTotal: ₱ ${amount}`)) event.preventDefault();
});
</script>
<script src="user.js"></script>
</body></html>
